name: Futbol Verilerini Otomatik Guncelle
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Bu satır dosya yazma izni verir
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python guncelle.py
      - name: Guncellenen Verileri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add veriler.json
          git commit -m "Otomatik veri guncelleme" || exit 0
          git push
name: Veri Guncelleme
on:
  schedule:
    - cron: '0 3 * * *' # Her gece 03:00
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  build:
    runs-with: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Python Kur
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Gereksinimleri Yükle
        run: pip install requests beautifulsoup4
      - name: Veriyi Güncelle
        run: python guncelle.py
      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add veriler.json
          git commit -m "Otomatik veri güncelleme"
          git push
