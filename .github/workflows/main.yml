name: Veri Guncelleme

on:
  schedule:
    - cron: '0 3 * * *' # Her gece UTC ile 03:00'te çalışır
  workflow_dispatch:   # Manuel çalıştırma butonu ekler

permissions:
  contents: write      # Dosyayı güncelleyebilmesi için yazma izni şart

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests beautifulsoup4

      - name: Veriyi Güncelle
        run: python guncelle.py

      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add veriler.json
          git commit -m "Otomatik veri güncelleme: $(date)" || echo "Değişiklik yok."
          git push
